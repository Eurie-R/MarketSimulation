[project]
name = "market-abm"
version = "0.1.0"
description = "Agent-based market model: transaction taxes and trader heterogeneity"
readme = "README.md"
authors = [
    { name = "Uri", email = "ramoy.uriel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "salib>=1.4.8",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1", "jupyterlab>=4.0"]   # sandbox.ipynb widgets
data = ["yfinance>=0.2.40"]                          # scripts/fetch_psei.py

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "marketabm"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
